version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gestorgastos-db
    environment:
      POSTGRES_DB: gestorgastos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gestorgastos-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestorgastos-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/gestorgastos
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - APP_CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      - db
    networks:
      - gestorgastos-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=http://localhost:8080/api
    container_name: gestorgastos-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gestorgastos-net

volumes:
  pgdata:

networks:
  gestorgastos-net:
    driver: bridge
